name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow and script syntax
        run: |
          python -m py_compile .github/scripts/*.py
          python -c "import glob, yaml; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]"

      # Vervang of vul aan met de build/test/lint commando's van het project.
      - name: Project checks
        run: echo "Geen project checks geconfigureerd."
